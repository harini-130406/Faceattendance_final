<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Face Attendance System{% endblock %}</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 4.6 & FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --primary-light: #e0f2fe;
            --secondary: #6366f1;
            --success: #10b981;
            --success-light: #d1fae5;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --warning: #f59e0b;
            --warning-light: #fef3c7;
            --dark: #0f172a;
            --dark-card: #1e293b;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-600: #475569;
            --gray-800: #1e293b;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            padding-top: 75px;
            padding-bottom: 90px;
        }

        button, .btn {
            cursor: pointer !important;
            user-select: none;
            position: relative;
        }

        button[type="submit"],
        input[type="submit"],
        .btn-modern-primary,
        .btn-modern-success {
            cursor: pointer !important;
            pointer-events: auto !important;
        }

        /* Modern Navbar */
        .navbar-modern {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            padding: 0.75rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .navbar-brand-custom {
            display: flex;
            align-items: center;
            font-weight: 700;
            font-size: 1.15rem;
            color: #fff !important;
            letter-spacing: -0.02em;
        }

        .navbar-brand-custom img {
            height: 38px;
            margin-right: 12px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
        }

        .nav-link-modern {
            color: #cbd5e1 !important;
            font-weight: 500;
            font-size: 0.92rem;
            padding: 0.5rem 0.9rem !important;
            border-radius: 8px;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .nav-link-modern:hover, .nav-link-modern.active {
            color: #ffffff !important;
            background: rgba(255, 255, 255, 0.12);
        }

        .nav-badge-pill {
            background: rgba(14, 165, 233, 0.2);
            color: #38bdf8;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        /* Modern Cards */
        .card-modern {
            background: #ffffff;
            border-radius: var(--radius-lg);
            border: 1px solid var(--gray-200);
            box-shadow: var(--shadow-md);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            overflow: hidden;
        }

        .card-modern:hover {
            box-shadow: var(--shadow-lg);
        }

        .card-header-modern {
            background: #ffffff;
            border-bottom: 1px solid var(--gray-100);
            padding: 1.25rem 1.5rem;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--dark);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-body-modern {
            padding: 1.5rem;
        }

        /* Stat KPI Cards */
        .stat-card {
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            background: #ffffff;
            border: 1px solid var(--gray-200);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .stat-icon {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 800;
            color: var(--dark);
            line-height: 1.1;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--gray-600);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-bottom: 4px;
        }

        /* Action Cards */
        .action-card {
            border-radius: var(--radius-lg);
            padding: 1.75rem;
            background: #ffffff;
            border: 1px solid var(--gray-200);
            box-shadow: var(--shadow-md);
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .action-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: transparent;
            transition: background 0.2s ease;
        }

        .action-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-xl);
        }

        .action-card.action-primary::before { background: linear-gradient(90deg, #0284c7, #38bdf8); }
        .action-card.action-success::before { background: linear-gradient(90deg, #10b981, #34d399); }
        .action-card.action-indigo::before { background: linear-gradient(90deg, #6366f1, #818cf8); }
        .action-card.action-amber::before { background: linear-gradient(90deg, #f59e0b, #fbbf24); }

        /* Modern Buttons */
        .btn-modern-primary {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            font-weight: 600;
            padding: 0.6rem 1.4rem;
            border-radius: 10px;
            border: none;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
            transition: all 0.2s ease;
        }

        .btn-modern-primary:hover {
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.35);
        }

        .btn-modern-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            font-weight: 600;
            padding: 0.6rem 1.4rem;
            border-radius: 10px;
            border: none;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
            transition: all 0.2s ease;
        }

        .btn-modern-success:hover {
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.35);
        }

        /* Status Pills */
        .badge-present {
            background-color: var(--success-light);
            color: #065f46;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 0.35rem 0.85rem;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-absent {
            background-color: var(--danger-light);
            color: #991b1b;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 0.35rem 0.85rem;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        /* Form Controls */
        .form-control-modern,
        select.form-control-modern,
        input.form-control-modern {
            height: 48px !important;
            min-height: 48px !important;
            line-height: normal !important;
            padding: 0.5rem 1rem !important;
            font-size: 0.95rem !important;
            border-radius: 10px !important;
            border: 1.5px solid #cbd5e1 !important;
            background-color: #ffffff !important;
            color: #0f172a !important;
            transition: all 0.2s ease !important;
            box-sizing: border-box !important;
            vertical-align: middle !important;
        }

        select.form-control-modern {
            padding-right: 2.2rem !important;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23475569' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M2 5l6 6 6-6'/%3e%3c/svg%3e") !important;
            background-repeat: no-repeat !important;
            background-position: right 0.85rem center !important;
            background-size: 14px 10px !important;
            cursor: pointer;
        }

        .form-control-modern:focus,
        select.form-control-modern:focus {
            border-color: var(--primary) !important;
            box-shadow: 0 0 0 3.5px rgba(2, 132, 199, 0.2) !important;
            outline: none !important;
            color: #0f172a !important;
        }

        label {
            font-weight: 600 !important;
            color: #334155 !important;
            margin-bottom: 0.4rem !important;
            font-size: 0.88rem !important;
        }

        /* Student Avatar */
        .student-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ffffff;
            box-shadow: var(--shadow-sm);
        }

        /* Dropzone / Upload Box */
        .upload-dropzone {
            border: 2px dashed #93c5fd;
            border-radius: var(--radius-lg);
            background: #f0f9ff;
            padding: 2.5rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upload-dropzone:hover {
            border-color: var(--primary);
            background: #e0f2fe;
        }

        /* Custom Alert */
        .alert-modern {
            border-radius: var(--radius-md);
            padding: 1rem 1.25rem;
            font-weight: 500;
            border: none;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 12px;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include 'attendence_sys/navbar.html' %}

    <div class="container-fluid px-lg-5 py-4">
        <!-- Toast & Messages Notification -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-modern {% if message.tags == 'error' %}alert-danger{% elif message.tags == 'warning' %}alert-warning{% elif message.tags == 'info' %}alert-info{% else %}alert-success{% endif %} alert-dismissible fade show" role="alert">
                    <i class="fas {% if message.tags == 'error' %}fa-circle-exclamation text-danger{% elif message.tags == 'warning' %}fa-triangle-exclamation text-warning{% elif message.tags == 'info' %}fa-circle-info text-info{% else %}fa-circle-check text-success{% endif %} fa-lg"></i>
                    <div>{{ message }}</div>
                    <button type="button" class="close ml-auto" data-dismiss="alert" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
