<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Face Attendance System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 4.6 & FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 18px;
            padding: 2.5rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
        }

        .brand-icon {
            width: 58px;
            height: 58px;
            border-radius: 14px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin: 0 auto 1.25rem auto;
            box-shadow: 0 8px 16px rgba(2, 132, 199, 0.3);
        }

        .form-control-modern {
            height: 48px !important;
            min-height: 48px !important;
            line-height: normal !important;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            padding: 0.5rem 1rem;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            box-sizing: border-box !important;
        }

        .form-control-modern:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
            outline: none;
        }

        .btn-modern-login {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            font-weight: 700;
            padding: 0.75rem;
            border-radius: 10px;
            border: none;
            width: 100%;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            transition: all 0.2s ease;
        }

        .btn-modern-login:hover {
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.4);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="brand-icon">
                <i class="fas fa-face-viewfinder"></i>
            </div>
            <h3 class="font-weight-bold text-dark mb-1">Face Attendance</h3>
            <p class="text-muted small">Sign in to your faculty portal</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger py-2 small rounded" role="alert">
                    <i class="fas fa-circle-exclamation mr-1"></i> {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="">
            {% csrf_token %}
            <div class="form-group mb-3">
                <label class="small font-weight-bold text-dark">Username</label>
                <div class="input-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text bg-light border-right-0" style="border-radius: 10px 0 0 10px;"><i class="fas fa-user text-muted"></i></span>
                    </div>
                    <input type="text" name="username" placeholder="Enter username..." class="form-control form-control-modern border-left-0" style="border-radius: 0 10px 10px 0;" required autofocus>
                </div>
            </div>

            <div class="form-group mb-4">
                <label class="small font-weight-bold text-dark">Password</label>
                <div class="input-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text bg-light border-right-0" style="border-radius: 10px 0 0 10px;"><i class="fas fa-lock text-muted"></i></span>
                    </div>
                    <input type="password" name="password" placeholder="Enter password..." class="form-control form-control-modern border-left-0" style="border-radius: 0 10px 10px 0;" required>
                </div>
            </div>

            <button class="btn btn-modern-login" type="submit">
                <i class="fas fa-right-to-bracket mr-1"></i> Login to Portal
            </button>
        </form>
    </div>
</body>
</html>
