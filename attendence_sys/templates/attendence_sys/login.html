<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Faculty Login | Smart Face Attendance System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 4.6 & FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        :root {
            --brand-primary: #1e40af;
            --brand-accent: #0284c7;
        }

        body, html {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0b1329 0%, #0f172a 45%, #1e3a8a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 20px;
            padding: 2.8rem 2.4rem;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
        }

        .brand-crest-login {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 1.25rem auto;
            box-shadow: 0 10px 25px rgba(30, 64, 175, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .institution-tag {
            font-size: 0.74rem;
            font-weight: 700;
            color: #1e40af;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: #eff6ff;
            padding: 3px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 8px;
        }

        .form-control-modern {
            height: 48px !important;
            border-radius: 10px;
            border: 1.5px solid #cbd5e1;
            padding: 0.55rem 1rem;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .form-control-modern:focus {
            border-color: var(--brand-accent);
            box-shadow: 0 0 0 3.5px rgba(2, 132, 199, 0.18);
            outline: none;
        }

        .btn-modern-login {
            background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);
            color: #ffffff;
            font-weight: 700;
            padding: 0.8rem;
            border-radius: 10px;
            border: none;
            width: 100%;
            box-shadow: 0 6px 18px rgba(30, 64, 175, 0.35);
            transition: all 0.2s ease;
            cursor: pointer !important;
            font-size: 1rem;
        }

        .btn-modern-login:hover {
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 8px 22px rgba(30, 64, 175, 0.45);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="brand-crest-login">
                <i class="fas fa-graduation-cap"></i>
            </div>
            <div class="institution-tag">SMART FACE ATTENDANCE</div>
            <h3 class="font-weight-bold text-dark mb-1" style="letter-spacing: -0.02em;">Faculty Portal</h3>
            <p class="text-muted small mb-0">Smart Biometric Attendance & AI Recognition</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger py-2 small rounded d-flex align-items-center mb-3" role="alert">
                    <i class="fas fa-circle-exclamation mr-2"></i> <span>{{ message }}</span>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="">
            {% csrf_token %}
            <div class="form-group mb-3">
                <label class="small font-weight-bold text-dark mb-1">
                    <i class="fas fa-user-tag text-primary mr-1"></i> Username or Email
                </label>
                <div class="input-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text bg-light border-right-0" style="border-radius: 10px 0 0 10px; border: 1.5px solid #cbd5e1; border-right: none;">
                            <i class="fas fa-user text-muted"></i>
                        </span>
                    </div>
                    <input type="text" name="username" placeholder="Username, Email, or Full Name" class="form-control form-control-modern border-left-0" style="border-radius: 0 10px 10px 0;" required autofocus>
                </div>
            </div>

            <div class="form-group mb-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="small font-weight-bold text-dark mb-0">
                        <i class="fas fa-lock text-primary mr-1"></i> Password
                    </label>
                    <a href="{% url 'password_reset' %}" class="small font-weight-bold text-primary text-decoration-none">
                        Forgot Password?
                    </a>
                </div>
                <div class="input-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text bg-light border-right-0" style="border-radius: 10px 0 0 10px; border: 1.5px solid #cbd5e1; border-right: none;">
                            <i class="fas fa-key text-muted"></i>
                        </span>
                    </div>
                    <input type="password" id="loginPassword" name="password" placeholder="Enter portal password" class="form-control form-control-modern border-left-0 border-right-0" required>
                    <div class="input-group-append">
                        <button type="button" class="btn btn-light border" style="border-radius: 0 10px 10px 0; border: 1.5px solid #cbd5e1; border-left: none;" onclick="togglePasswordVisibility('loginPassword', this)">
                            <i class="fas fa-eye text-muted"></i>
                        </button>
                    </div>
                </div>
            </div>

            <button class="btn btn-modern-login mb-3" type="submit">
                <i class="fas fa-right-to-bracket mr-2"></i> Sign In to Portal
            </button>

            <div class="text-center pt-3 border-top">
                <span class="small text-muted">New faculty member?</span>
                <a href="{% url 'register' %}" class="small font-weight-bold text-success text-decoration-none ml-1">
                    <i class="fas fa-user-plus mr-1"></i> Create New Account
                </a>
            </div>
        </form>
    </div>

    <script>
    function togglePasswordVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'fas fa-eye-slash text-primary';
        } else {
            input.type = 'password';
            icon.className = 'fas fa-eye text-muted';
        }
    }
    </script>
</body>
</html>
