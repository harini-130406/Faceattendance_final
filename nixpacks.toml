# Railway Nixpacks Configuration
# Installs native C++ build tools & OpenBLAS for compiling dlib and face-recognition
[phases.setup]
nixPkgs = ["cmake", "pkg-config", "gcc", "openblas"]

[phases.install]
cmds = ["pip install --upgrade pip setuptools wheel", "pip install -r requirements.txt"]

[phases.build]
cmds = ["python manage.py collectstatic --noinput"]

[start]
cmd = "python manage.py migrate && gunicorn Attendence_System.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
