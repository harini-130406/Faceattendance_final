# Railway Nixpacks Configuration
# Installs native C++ build tools & OpenBLAS for compiling dlib and face-recognition
[phases.setup]
nixPkgs = ["cmake", "pkg-config", "gcc", "openblas"]

[phases.install]
cmds = ["pip install --upgrade pip wheel", "pip install \"setuptools==80.10.2\"", "pip install -r requirements.txt"]

[phases.build]
cmds = ["python manage.py collectstatic --noinput"]

[start]
cmd = "python manage.py migrate && gunicorn Attendence_System.wsgi:application --bind 0.0.0.0:${PORT:-8080} --bind 0.0.0.0:8000 --workers 2 --timeout 120"
